# ============================================================
#  ICU mod - build configuration
#  All basic settings live here; edit this file, not build.gradle.
# ============================================================

# --- Machine / encoding ---
# NOTE: org.gradle.jvmargs is intentionally NOT set here. Setting it forces
# Gradle to fork a single-use daemon, which fails in restricted environments
# that forbid named-pipe creation. Memory can be passed via GRADLE_OPTS instead.
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# --- Mod identity ---
mod_id=icu
mod_name=ICU
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.icu.icu
mod_authors=ICU
mod_description=ICU - realistic body trauma and medical system for Minecraft. First feature: massive bleeding (haemorrhage).

# --- Platform versions (verified against maven.neoforged.net) ---
# NeoForge 21.1.x == Minecraft 1.21.1 ; 21.1.252 is the latest 21.1.x release.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.252
neo_version_range=[21.1.0,)
loader_version_range=[1,)

# --- Parchment mappings: disabled by default (keeps the build offline-friendly) ---
parchment_enabled=false
